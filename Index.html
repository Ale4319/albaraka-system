
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام البركة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Tahoma,Arial;background:#f4eee5;color:#493321;margin:0}
header{background:#6b4b35;color:white;padding:20px;text-align:center}
main{max-width:850px;margin:auto;padding:12px}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px}
h2{color:#6b4b35;font-size:19px}
input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{background:#6b4b35;color:white;border:0;font-weight:bold}
.secondary{background:#eee5da;color:#493321}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px;border-bottom:1px solid #ddd;text-align:right}
.msg{padding:10px;background:#f5f0e9;border-radius:8px;margin-top:8px;white-space:pre-wrap}
.error{background:#ffe9e7;color:#a00}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{width:auto;flex:1}
.small{font-size:12px;color:#777}
</style>
</head>
<body>

<header>
<h2 style="color:white">نظام البركة</h2>
<p>إدارة المخزون والمخازن والفروع</p>
</header>

<main>

<section id="login" class="card">
<h2>تسجيل الدخول</h2>
<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<div id="loginMsg" class="msg">أدخل بيانات حسابك.</div>
</section>

<section id="application" class="hidden">

<div class="card">
<h3 id="welcome">مرحباً بك</h3>
<div id="company"></div>
<button class="secondary" onclick="logout()">تسجيل الخروج</button>
<nav>
<button onclick="showTab('products')">المواد</button>
<button onclick="showTab('movement')">حركة المخزون</button>
<button onclick="showTab('stock')">الأرصدة</button>
</nav>
<div id="message" class="msg">متصل بالنظام</div>
</div>

<div id="products" class="card">
<h2>إضافة مادة جديدة</h2>
<label>اسم المادة</label>
<input id="pname" placeholder="مثال: فرينة">
<label>الباركود</label>
<input id="pbarcode" placeholder="الباركود">
<label>وحدة القياس</label>
<input id="punit" placeholder="كغ أو لتر أو قطعة">
<label>الحد الأدنى للمخزون</label>
<input id="pmin" type="number" min="0" value="0">
<button onclick="addProduct()">حفظ المادة</button>
<h2>قائمة المواد</h2>
<div id="productList">جار التحميل...</div>
</div>

<div id="movement" class="card hidden">
<h2>تسجيل حركة مخزون</h2>
<label>المادة</label>
<select id="productSelect"></select>
<label>المخزن</label>
<select id="warehouseSelect"></select>
<label>نوع الحركة</label>
<select id="movementType">
<option value="in">دخول إلى المخزن</option>
<option value="out">خروج من المخزن</option>
</select>
<label>الكمية</label>
<input id="quantity" type="number" min="0.001" step="0.001">
<label>ملاحظة أو رقم الفاتورة</label>
<input id="notes" placeholder="اختياري">
<button onclick="saveMovement()">حفظ الحركة</button>
</div>

<div id="stock" class="card hidden">
<h2>أرصدة المخازن</h2>
<button class="secondary" onclick="loadStock()">تحديث الأرصدة</button>
<div id="stockList">اضغط تحديث.</div>
</div>

<div class="card small">
نسخة أولية قيد الاختبار. يجب التحقق من الصلاحيات واحتساب جميع الحركات قبل اعتماد الأرصدة رسمياً.
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://ogpvudhotuhthywxrakm.supabase.co";
const SUPABASE_KEY = "sb_publishable_I4Co1ZEybYARgdWyQae3Gg_164EsQ8h";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let profile = null;
let products = [];
let warehouses = [];

function message(text,error=false){
 const el=document.getElementById("message");
 el.textContent=text;
 el.className=error?"msg error":"msg";
}

function showTab(tab){
 ["products","movement","stock"].forEach(id=>{
 document.getElementById(id).classList.add("hidden");
 });
 document.getElementById(tab).classList.remove("hidden");
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 document.getElementById("loginMsg").textContent="جار التحقق...";
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){
 document.getElementById("loginMsg").textContent="خطأ في الدخول: "+error.message;
 return;
 }
 await startApp();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function startApp(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("application").classList.remove("hidden");

 const {data:{user}}=await db.auth.getUser();

 const {data,error}=await db
 .from("user_profiles")
 .select("*")
 .eq("user_id",user.id)
 .single();

 if(error){
 message("تعذر قراءة بيانات المستخدم: "+error.message,true);
 return;
 }

 profile=data;
 document.getElementById("welcome").textContent=
 profile.full_name || "مرحباً بك في نظام البركة";

 const {data:company}=await db
 .from("companies")
 .select("name")
 .eq("id",profile.company_id)
 .maybeSingle();

 document.getElementById("company").textContent=
 company ? company.name : "";

 await loadData();
}

async function loadData(){
 const [p,w]=await Promise.all([
 db.from("products")
 .select("*")
 .eq("company_id",profile.company_id)
 .order("name"),
 db.from("warehouses")
 .select("*")
 .eq("company_id",profile.company_id)
 .order("name")
 ]);

 if(p.error || w.error){
 message("خطأ في تحميل البيانات: "+
 (p.error?.message || w.error?.message),true);
 return;
 }

 products=p.data || [];
 warehouses=w.data || [];

 renderProducts();
 fillLists();
 message("تم الاتصال بقاعدة البيانات. عدد المواد: "+
 products.length+" — عدد المخازن: "+warehouses.length);
}

function renderProducts(){
 const box=document.getElementById("productList");
 if(!products.length){
 box.textContent="لا توجد مواد مسجلة.";
 return;
 }

 box.innerHTML="<table><tr><th>المادة</th><th>الباركود</th><th>الوحدة</th></tr>"+
 products.map(p=>"<tr><td>"+safe(p.name)+
 "</td><td>"+safe(p.barcode||"—")+
 "</td><td>"+safe(p.unit||"—")+"</td></tr>").join("")+
 "</table>";
}

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}

function fillLists(){
 document.getElementById("productSelect").innerHTML=
 products.map(p=>"<option value='"+safe(p.id)+"'>"+
 safe(p.name)+"</option>").join("");

 document.getElementById("warehouseSelect").innerHTML=
 warehouses.map(w=>"<option value='"+safe(w.id)+"'>"+
 safe(w.name)+"</option>").join("");
}

async function addProduct(){
 const name=document.getElementById("pname").value.trim();

 if(!name){
 message("يرجى إدخال اسم المادة.",true);
 return;
 }

 const payload={
 company_id:profile.company_id,
 name:name,
 barcode:document.getElementById("pbarcode").value.trim()||null,
 unit:document.getElementById("punit").value.trim()||null,
 minimum_stock:Number(document.getElementById("pmin").value||0)
 };

 const {error}=await db.from("products").insert(payload);

 if(error){
 message("لم يتم حفظ المادة: "+error.message,true);
 return;
 }

 document.getElementById("pname").value="";
 document.getElementById("pbarcode").value="";
 document.getElementById("punit").value="";
 document.getElementById("pmin").value="0";

 await loadData();
 message("تم حفظ المادة بنجاح.");
}

async function saveMovement(){
 const product_id=document.getElementById("productSelect").value;
 const warehouse_id=document.getElementById("warehouseSelect").value;
 const quantity=Number(document.getElementById("quantity").value);

 if(!product_id || !warehouse_id || quantity<=0){
 message("اختر المادة والمخزن وأدخل كمية صحيحة.",true);
 return;
 }

 const {data:{user}}=await db.auth.getUser();

 const payload={
 company_id:profile.company_id,
 product_id:product_id,
 warehouse_id:warehouse_id,
 movement_type:document.getElementById("movementType").value,
 quantity:quantity,
 notes:document.getElementById("notes").value.trim()||null,
 user_id:user.id
 };

 const {error}=await db.from("stock_movements").insert(payload);

 if(error){
 message("لم يتم تسجيل الحركة: "+error.message,true);
 return;
 }

 document.getElementById("quantity").value="";
 document.getElementById("notes").value="";
 message("تم تسجيل حركة المخزون بنجاح.");
}

async function loadStock(){
 const box=document.getElementById("stockList");
 box.textContent="جار تحميل الحركات...";

 const {data,error}=await db.from("stock_movements")
 .select("product_id,warehouse_id,movement_type,quantity,created_at")
 .eq("company_id",profile.company_id)
 .order("created_at",{ascending:true})
 .limit(1000);

 if(error){
 box.textContent="خطأ: "+error.message;
 return;
 }

 const totals={};

 (data||[]).forEach(m=>{
 const key=m.product_id+"|"+m.warehouse_id;
 if(totals[key]===undefined) totals[key]=0;
 const q=Number(m.quantity)||0;
 totals[key]+=m.movement_type==="out"?-q:q;
 });

 const pn=Object.fromEntries(products.map(p=>[p.id,p.name]));
 const wn=Object.fromEntries(warehouses.map(w=>[w.id,w.name]));

 const rows=Object.entries(totals).map(([key,value])=>{
 const ids=key.split("|");
 return "<tr><td>"+safe(pn[ids[0]]||ids[0])+
 "</td><td>"+safe(wn[ids[1]]||ids[1])+
 "</td><td>"+value.toFixed(3)+"</td></tr>";
 });

 box.innerHTML=rows.length?
 "<table><tr><th>المادة</th><th>المخزن</th><th>الرصيد</th></tr>"+
 rows.join("")+"</table>"+
 "<p class='small'>ملخص تجريبي لآخر 1000 حركة فقط.</p>":
 "لا توجد حركات مسجلة.";
}

db.auth.getSession().then(({data})=>{
 if(data.session) startApp();
});
</script>
</body>
</html>
